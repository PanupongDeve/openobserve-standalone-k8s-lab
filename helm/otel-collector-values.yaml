# OpenTelemetry Collector Helm Configuration
# Mode: DaemonSet for Kubernetes Container Logs Collection to OpenObserve

mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces", "nodes"]
      verbs: ["get", "watch", "list"]
    - apiGroups: ["apps"]
      resources: ["replicasets", "daemonsets", "deployments", "statefulsets"]
      verbs: ["get", "watch", "list"]

# OpenTelemetry Collector Pipelines & Components Config
config:
  receivers:
    filelog:
      include:
        - /var/log/pods/*/*/*.log
      exclude:
        # Exclude collector's own logs to prevent infinite loop
        - /var/log/pods/openobserve_otel-collector*/*/*.log
        - /var/log/pods/openobserve_openobserve-otel-collector*/*/*.log
      start_at: beginning
      include_file_path: true
      include_file_name: false
      operators:
        # 1. Parse CRI-O / Containerd standard log line: "<timestamp> <stream> <tag> <log>"
        - type: regex_parser
          regex: '^(?P<time>[^ ]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) (?P<log>.*)$'
          timestamp:
            parse_from: attributes.time
            layout: '%Y-%m-%dT%H:%M:%S.%L%z'
          severity:
            parse_from: attributes.stream
            mapping:
              error: stderr
              info: stdout
          on_error: send
        # 2. Extract Kubernetes namespace, pod name, and container name from log file path
        - type: regex_parser
          parse_from: attributes["log.file.path"]
          regex: '^/var/log/pods/(?P<k8s_namespace_name>[^_]+)_(?P<k8s_pod_name>[^_]+)_(?P<k8s_pod_uid>[^/]+)/(?P<k8s_container_name>[^/]+)/.*$'
          on_error: send

  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 20

    k8sattributes:
      auth_type: serviceAccount
      passthrough: false
      extract:
        metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.namespace.name
          - k8s.node.name
          - k8s.container.name

    resource:
      attributes:
        - action: insert
          key: service.name
          from_attribute: k8s_container_name
        - action: insert
          key: stream_name
          value: k8s_logs

    batch:
      send_batch_size: 1000
      timeout: 5s

  exporters:
    otlphttp/openobserve:
      endpoint: "http://openobserve-openobserve-standalone.openobserve.svc.cluster.local:5080/api/default"
      headers:
        # Basic Auth: root@example.com:Complexpass#123 -> Base64
        Authorization: "Basic cm9vdEBleGFtcGxlLmNvbTpDb21wbGV4cGFzcyMxMjM="
        stream-name: "k8s_logs"
      tls:
        insecure: true

  service:
    pipelines:
      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlphttp/openobserve]

# Mount Host Log Directories for Container Log Access
extraVolumes:
  - name: varlogpods
    hostPath:
      path: /var/log/pods
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers

extraVolumeMounts:
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true

# Resource Limits & Requests
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
